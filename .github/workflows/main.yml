name: China Smallcap Watch

on:

  workflow_dispatch:

  schedule:

    - cron: "7,22,37,52 * * * *"

permissions:

  contents: read

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Scan market and SEC filings

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          python - <<'PY'

          import os

          import re

          import json

          import time

          import urllib.request

          import urllib.parse

          from datetime import datetime, timezone

          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          if not TOPIC:

              raise SystemExit("NTFY_TOPIC secret is missing")

          EMAIL = "jeoob1226@naver.com"

          YAHOO_HEADERS = {"User-Agent": "Mozilla/5.0"}

          SEC_HEADERS = {

              "User-Agent": f"ChinaSmallcapWatch/1.0 (contact: {EMAIL})",

              "Accept-Encoding": "gzip, deflate",

          }

          GITHUB_HEADERS = {

              "User-Agent": "ChinaSmallcapWatch/1.0",

              "Accept": "application/vnd.github+json",

          }

          def get_json(url, headers, timeout=20):

              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=timeout) as response:

                  return json.loads(response.read().decode("utf-8"))

          def get_text(url, headers, limit=1800000):

              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=20) as response:

                  return response.read(limit).decode("utf-8", errors="ignore")

          # 1. Yahoo Finance market scan

          found = {}

          for screener in ["small_cap_gainers", "most_actives"]:

              params = urllib.parse.urlencode({

                  "scrIds": screener,

                  "count": 250,

                  "start": 0,

                  "formatted": "false"

              })

              url = (

                  "https://query1.finance.yahoo.com/v1/finance/"

                  "screener/predefined/saved?" + params

              )

              try:

                  data = get_json(url, YAHOO_HEADERS)

                  results = data.get("finance", {}).get("result") or []

                  for quote in results[0].get("quotes", []) if results else []:

                      symbol = quote.get("symbol")

                      if symbol:

                          found[symbol] = quote

              except Exception as e:

                  print(f"Yahoo {screener} unavailable: {e}")

          if not found:

              raise SystemExit("No Yahoo market data received")

          candidates = []

          for symbol, quote in found.items():

              price = quote.get("regularMarketPrice")

              volume = quote.get("regularMarketVolume")

              avg = quote.get("averageDailyVolume3Month")

              name = quote.get("longName") or quote.get("shortName") or symbol

              if not all(isinstance(v, (int, float)) for v in [price, volume, avg]):

                  continue

              if price <= 0 or avg <= 0:

                  continue

              if price > 20 or volume < 100000:

                  continue

              ratio = volume / avg

              if ratio < 2:

                  continue

              candidates.append({

                  "symbol": symbol,

                  "name": name,

                  "price": price,

                  "volume": volume,

                  "avg": avg,

                  "ratio": ratio

              })

          candidates.sort(

              key=lambda item: (item["ratio"], item["volume"]),

              reverse=True

          )

          candidates = candidates[:10]

          # 2. Get ticker-to-CIK mapping:

          #    try official SEC first, then public GitHub mirror.

          sec_map = {}

          mapping_source = "none"

          mapping_errors = []

          try:

              mapping = get_json(

                  "https://www.sec.gov/files/company_tickers.json",

                  SEC_HEADERS

              )

              for item in mapping.values():

                  ticker = str(item.get("ticker", "")).upper()

                  cik = item.get("cik_str")

                  if ticker and cik:

                      sec_map[ticker] = str(cik).zfill(10)

              if sec_map:

                  mapping_source = "SEC official"

          except Exception as e:

              mapping_errors.append(f"SEC official mapping: {e}")

              print("Official SEC mapping unavailable:", e)

          if not sec_map:

              mirror_url = (

                  "https://raw.githubusercontent.com/"

                  "jadchaar/sec-cik-mapper/main/"

                  "mappings/stocks/ticker_to_cik.json"

              )

              try:

                  mirror = get_json(mirror_url, GITHUB_HEADERS)

                  if isinstance(mirror, dict):

                      for ticker, value in mirror.items():

                          cik = None

                          if isinstance(value, (str, int)):

                              cik = value

                          elif isinstance(value, dict):

                              cik = value.get("cik") or value.get("cik_str")

                          if cik is not None:

                              ticker = str(ticker).upper().strip()

                              cik_text = str(cik).strip()

                              if ticker and cik_text.isdigit():

                                  sec_map[ticker] = cik_text.zfill(10)

                  if sec_map:

                      mapping_source = "GitHub public mirror"

                  else:

                      mapping_errors.append("GitHub mirror returned no usable mappings")

              except Exception as e:

                  mapping_errors.append(f"GitHub mapping mirror: {e}")

                  print("GitHub mapping mirror unavailable:", e)

          print(f"Ticker mapping source: {mapping_source}")

          print(f"Ticker mappings loaded: {len(sec_map)}")

          # 3. SEC filings checks are separate from mapping success.

          china_terms = [

              "people's republic of china",

              "mainland china",

              "china-based",

              "china operations",

              "operations in china",

              "subsidiaries in china",

              "manufacturing in china",

              "facilities in china",

              "employees in china",

              "hong kong",

              "prc subsidiary",

              "china revenue",

              "located in china",

              "headquartered in china",

          ]

          business_terms = [

              "operations", "operates", "manufacturing", "facility",

              "facilities", "subsidiary", "subsidiaries", "employees",

              "revenue", "headquarters", "production", "business activities"

          ]

          dilution_terms = [

              "at-the-market offering",

              "at the market offering",

              "equity line of credit",

              "registered direct offering",

              "convertible notes",

              "convertible securities",

              "warrants outstanding",

              "warrant exercise",

              "shares of common stock offered",

              "sales agreement",

              "shelf registration",

              "securities purchase agreement",

              "private placement",

          ]

          offering_forms = {

              "S-1", "S-3", "S-1/A", "S-3/A",

              "424B3", "424B5", "424B4"

          }

          def clean_html(text):

              text = re.sub(

                  r"(?is)<(script|style).*?>.*?</\\1>", " ", text

              )

              text = re.sub(r"(?s)<[^>]+>", " ", text)

              text = re.sub(r"&nbsp;|&#160;", " ", text)

              text = re.sub(r"&amp;", "&", text)

              text = re.sub(r"&#\\d+;|&[a-zA-Z]+;", " ", text)

              return re.sub(r"\\s+", " ", text)

          def inspect_sec(symbol):

              result = {

                  "mapping": "없음",

                  "filings": "조회 실패",

                  "china": "확인 불가",

                  "dilution": "확인 불가",

                  "filing": None,

                  "source": None,

              }

              cik = sec_map.get(symbol.upper())

              if not cik:

                  result["mapping"] = "티커-CIK 매핑 없음"

                  return result

              result["mapping"] = "CIK 연결 성공"

              submissions_url = (

                  f"https://data.sec.gov/submissions/CIK{cik}.json"

              )

              try:

                  time.sleep(0.25)

                  submissions = get_json(submissions_url, SEC_HEADERS)

                  recent = submissions.get("filings", {}).get("recent", {})

                  forms = recent.get("form", [])

                  accessions = recent.get("accessionNumber", [])

                  documents = recent.get("primaryDocument", [])

                  dates = recent.get("filingDate", [])

                  records = []

                  for i, form in enumerate(forms):

                      if i >= len(accessions) or i >= len(documents):

                          continue

                      records.append({

                          "form": form,

                          "accession": accessions[i],

                          "document": documents[i],

                          "date": dates[i] if i < len(dates) else ""

                      })

                  annual = [

                      row for row in records

                      if row["form"] in {"10-K", "20-F", "40-F"}

                  ]

                  offering = [

                      row for row in records

                      if row["form"] in offering_forms

                  ]

                  to_check = []

                  if annual:

                      to_check.append(annual[0])

                  if offering and offering[0] not in to_check:

                      to_check.append(offering[0])

                  result["filings"] = "제출 목록 조회 성공"

                  if not to_check:

                      result["china"] = "검토할 연차/발행 공시 없음"

                      result["dilution"] = "관련 공시 추가 확인 필요"

                      return result

                  china_found = False

                  dilution_found = False

                  documents_read = 0

                  document_errors = []

                  for filing in to_check[:2]:

                      accession_path = filing["accession"].replace("-", "")

                      document = urllib.parse.quote(filing["document"])

                      document_url = (

                          "https://www.sec.gov/Archives/edgar/data/"

                          f"{int(cik)}/{accession_path}/{document}"

                      )

                      try:

                          time.sleep(0.25)

                          raw = get_text(document_url, SEC_HEADERS)

                          body = clean_html(raw).lower()

                          documents_read += 1

                          if not result["filing"]:

                              result["filing"] = (

                                  filing["form"] + " / " + filing["date"]

                              )

                              result["source"] = document_url

                          if (

                              any(term in body for term in china_terms)

                              and any(term in body for term in business_terms)

                          ):

                              china_found = True

                          if filing["form"] in offering_forms:

                              dilution_found = True

                          if any(term in body for term in dilution_terms):

                              dilution_found = True

                      except Exception as e:

                          document_errors.append(str(e))

                          print(f"SEC document unavailable for {symbol}: {e}")

                  if documents_read:

                      result["china"] = (

                          "중국 관련 사업 단서 발견 - 문맥 확인 필요"

                          if china_found else "조회 공시에서 단서 미발견"

                      )

                      result["dilution"] = (

                          "희석 관련 키워드 발견 - 추가 검토 필요"

                          if dilution_found

                          else "조회 공시에서 주요 키워드 미발견"

                      )

                  else:

                      result["filings"] = "제출 목록은 조회했으나 공시 본문 접근 실패"

              except Exception as e:

                  result["filings"] = f"SEC 제출 목록 조회 실패: {type(e).__name__}"

                  print(f"SEC submissions unavailable for {symbol}: {e}")

              return result

          for candidate in candidates:

              candidate["sec"] = inspect_sec(candidate["symbol"])

          # 4. Alert construction

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          lines = [

              "중국계 미국 소형주 조기 감지 - 예비 스캔",

              f"스캔 시각(UTC): {now}",

              "시장 데이터: Yahoo Finance (지연 가능)",

              f"티커-CIK 매핑: {mapping_source}",

              "조건: 주가 $20 이하, 거래량 10만 주 이상, 평균 대비 2배 이상",

              "장중 거래량은 누적 중이며 거래량 배수만으로 상승을 예측할 수 없습니다.",

              "중국 단서와 희석 키워드는 확정 판정이 아니며 문맥 검토가 필요합니다.",

              ""

          ]

          for c in candidates:

              sec = c["sec"]

              liquidity = (

                  "평균 거래량 낮음 주의"

                  if c["avg"] < 50000

                  else "평균 거래량 필터 통과"

              )

              lines.append(

                  f'{c["symbol"]} | {c["name"]}\n'

                  f'주가: ${c["price"]:.2f} | 거래량: {c["volume"]:,.0f} | '

                  f'3개월 평균: {c["avg"]:,.0f} | 배수: {c["ratio"]:.1f}x\n'

                  f'유동성: {liquidity}\n'

                  f'티커-CIK: {sec["mapping"]}\n'

                  f'SEC 제출 목록: {sec["filings"]}\n'

                  f'중국 관련성: {sec["china"]}\n'

                  f'희석 단서: {sec["dilution"]}\n'

                  f'공시: {sec["filing"] or "조회 자료 없음"}\n'

                  f'{sec["source"] or ""}\n'

              )

          if not candidates:

              lines.append("현재 조건을 통과한 후보가 없습니다.")

          if mapping_errors:

              lines.append("매핑 조회 참고: " + " | ".join(mapping_errors[:2]))

          message = "\n".join(lines)

          print(message)

          # Keep the existing notification behavior.

          if candidates:

              request = urllib.request.Request(

                  "https://ntfy.sh/" + urllib.parse.quote(TOPIC, safe=""),

                  data=message.encode("utf-8"),

                  headers={

                      "Title": "China Smallcap Alert",

                      "Priority": "high",

                      "Tags": "chart_with_upwards_trend",

                      "Content-Type": "text/plain; charset=utf-8"

                  },

                  method="POST"

              )

              with urllib.request.urlopen(request, timeout=20) as response:

                  print("ntfy response:", response.status)

          else:

              print("No candidates; no ntfy alert sent.")

          PY
