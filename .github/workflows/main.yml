name: China Smallcap Watch

on:

  schedule:

    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: china-smallcap-watch

  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: python -m pip install --disable-pip-version-check requests

      - name: Scan candidates and notify

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          cat > scan.py <<'PY'

          import os

          import re

          import json

          import time

          import requests

          from datetime import datetime, timezone

          SESSION = requests.Session()

          SESSION.headers.update({

              "User-Agent": "Mozilla/5.0 ChinaSmallcapWatch/1.0",

              "Accept": "application/json,text/plain,*/*"

          })

          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          PRICE_MAX = 20.0

          VOLUME_MIN = 100_000

          VOLUME_MULTIPLE_MIN = 2.0

          MAX_ALERTS = 15

          def get_json(url, timeout=12):

              try:

                  r = SESSION.get(url, timeout=timeout)

                  r.raise_for_status()

                  return r.json()

              except Exception as e:

                  print(f"Data request failed: {url} | {e}")

                  return None

          def yahoo_screen(screen_name):

              url = (

                  "https://query1.finance.yahoo.com/v1/finance/"

                  "screener/predefined/saved"

              )

              params = {

                  "formatted": "false",

                  "lang": "en-US",

                  "region": "US",

                  "scrIds": screen_name,

                  "count": 250,

                  "start": 0

              }

              try:

                  r = SESSION.get(url, params=params, timeout=15)

                  r.raise_for_status()

                  data = r.json()

                  results = data.get("finance", {}).get("result", [])

                  if not results:

                      return []

                  return results[0].get("quotes", []) or []

              except Exception as e:

                  print(f"Yahoo screener failed ({screen_name}): {e}")

                  return []

          def num(value, default=0):

              try:

                  return float(value) if value is not None else default

              except (ValueError, TypeError):

                  return default

          def collect_candidates():

              merged = {}

              for screen in ("small_cap_gainers", "most_actives"):

                  for q in yahoo_screen(screen):

                      ticker = str(q.get("symbol", "")).upper().strip()

                      if not ticker or not re.fullmatch(

                          r"[A-Z][A-Z0-9.\-]{0,9}", ticker

                      ):

                          continue

                      price = num(

                          q.get("regularMarketPrice")

                          or q.get("regularMarketPreviousClose")

                      )

                      volume = num(q.get("regularMarketVolume"))

                      avg_volume = num(

                          q.get("averageDailyVolume3Month")

                          or q.get("averageDailyVolume10Day")

                      )

                      if price <= 0 or price > PRICE_MAX:

                          continue

                      if volume < VOLUME_MIN:

                          continue

                      multiple = volume / avg_volume if avg_volume > 0 else 0

                      if multiple < VOLUME_MULTIPLE_MIN:

                          continue

                      item = merged.setdefault(ticker, {

                          "ticker": ticker,

                          "name": q.get("shortName")

                                  or q.get("longName")

                                  or ticker,

                          "price": price,

                          "volume": int(volume),

                          "avg_volume": int(avg_volume),

                          "multiple": multiple,

                          "change": num(q.get("regularMarketChangePercent")),

                          "market_cap": num(q.get("marketCap")),

                          "screens": set()

                      })

                      item["screens"].add(screen)

                      if multiple > item["multiple"]:

                          item["multiple"] = multiple

                          item["volume"] = int(volume)

                          item["avg_volume"] = int(avg_volume)

              return sorted(

                  merged.values(),

                  key=lambda x: x["multiple"],

                  reverse=True

              )

          def load_ticker_ciks():

              sources = [

                  "https://www.sec.gov/files/company_tickers.json",

                  "https://raw.githubusercontent.com/jadchaar/sec-cik-mapper/main/mappings/stocks/ticker_to_cik.json"

              ]

              for url in sources:

                  try:

                      r = SESSION.get(url, timeout=15)

                      r.raise_for_status()

                      data = r.json()

                      mapping = {}

                      if isinstance(data, dict):

                          for value in data.values():

                              if isinstance(value, dict):

                                  ticker = str(

                                      value.get("ticker", "")

                                  ).upper()

                                  cik = value.get("cik_str")

                                  if ticker and cik:

                                      mapping[ticker] = str(cik).zfill(10)

                          if not mapping:

                              for ticker, cik in data.items():

                                  if isinstance(cik, (int, str)):

                                      mapping[str(ticker).upper()] = str(cik).zfill(10)

                      if mapping:

                          print(f"Ticker-CIK mapping loaded: {len(mapping)}")

                          print(f"Mapping source: {url}")

                          return mapping

                  except Exception as e:

                      print(f"Ticker mapping unavailable: {e}")

              return {}

          CHINA_TERMS = [

              "china", "chinese", "hong kong", "beijing", "shanghai",

              "shenzhen", "guangzhou", "prc", "people's republic of china",

              "variable interest entity", "v.i.e."

          ]

          DILUTION_TERMS = [

              "at-the-market", "at the market offering", "equity distribution",

              "sales agreement", "shelf registration", "registered direct offering",

              "public offering", "private placement", "convertible note",

              "convertible debenture", "warrant", "exercise price",

              "reverse stock split", "dilutive", "dilution",

              "securities purchase agreement", "424b5", "s-1", "s-3",

              "prospectus supplement", "equity line of credit"

          ]

          def sec_check(ticker, mapping):

              result = {

                  "china": "확인 불가",

                  "dilution": "확인 불가",

                  "source": None,

                  "status": "공시 조회 실패"

              }

              cik = mapping.get(ticker)

              if not cik:

                  result["status"] = "CIK 매핑 없음"

                  return result

              # SEC submissions may return 403 in hosted runners.

              url = f"https://data.sec.gov/submissions/CIK{cik}.json"

              try:

                  r = SESSION.get(

                      url,

                      headers={

                          "User-Agent": "Research contact research@example.com",

                          "Accept-Encoding": "gzip, deflate",

                          "Host": "data.sec.gov"

                      },

                      timeout=12

                  )

                  if r.status_code == 403:

                      result["status"] = "SEC 403 접근 차단"

                      return result

                  r.raise_for_status()

                  data = r.json()

                  recent = data.get("filings", {}).get("recent", {})

                  forms = recent.get("form", [])

                  dates = recent.get("filingDate", [])

                  docs = recent.get("primaryDocument", [])

                  accessions = recent.get("accessionNumber", [])

                  company = data.get("name", ticker)

                  china_hits = set()

                  dilution_hits = set()

                  checked = 0

                  for i, form in enumerate(forms):

                      if i >= len(dates) or i >= len(docs) or i >= len(accessions):

                          continue

                      if form not in {

                          "10-K", "10-Q", "8-K", "S-1", "S-3",

                          "424B3", "424B5", "6-K", "20-F", "F-1", "F-3"

                      }:

                          continue

                      accession = accessions[i].replace("-", "")

                      document = docs[i]

                      filing_url = (

                          f"https://www.sec.gov/Archives/edgar/data/"

                          f"{int(cik)}/{accession}/{document}"

                      )

                      try:

                          fr = SESSION.get(filing_url, timeout=10)

                          if fr.status_code != 200:

                              continue

                          body = re.sub(

                              r"<script\b[^>]*>.*?</script>",

                              " ", fr.text, flags=re.I | re.S

                          )

                          body = re.sub(r"<[^>]+>", " ", body)

                          body = re.sub(r"\s+", " ", body).lower()

                          checked += 1

                          for term in CHINA_TERMS:

                              if term in body:

                                  china_hits.add(term)

                          for term in DILUTION_TERMS:

                              if term in body:

                                  dilution_hits.add(term)

                          if checked >= 3:

                              break

                          time.sleep(0.15)

                      except Exception:

                          continue

                  if checked:

                      result["status"] = f"공시 {checked}건 확인"

                      result["source"] = (

                          f"https://www.sec.gov/edgar/search/"

                          f"#/entityName={cik}"

                      )

                      result["china"] = (

                          "중국 관련 키워드 발견: "

                          + ", ".join(sorted(china_hits)[:5])

                          if china_hits else

                          "최근 확인 공시에서 관련 키워드 미발견"

                      )

                      result["dilution"] = (

                          "희석 관련 키워드 발견: "

                          + ", ".join(sorted(dilution_hits)[:6])

                          if dilution_hits else

                          "최근 확인 공시에서 관련 키워드 미발견"

                      )

                  else:

                      result["status"] = "공시 본문 확인 실패"

              except Exception as e:

                  print(f"SEC check failed for {ticker}: {e}")

                  result["status"] = "SEC 조회 오류"

              return result

          def send_ntfy(message):

              if not TOPIC:

                  print("NTFY_TOPIC secret is missing; notification skipped.")

                  return False

              try:

                  r = requests.post(

                      f"https://ntfy.sh/{TOPIC}",

                      data=message.encode("utf-8"),

                      headers={

                          "Title": "중국계 미국 소형주 조기 감시",

                          "Priority": "high",

                          "Tags": "chart_with_upwards_trend,mag"

                      },

                      timeout=15

                  )

                  print(f"ntfy response: {r.status_code}")

                  r.raise_for_status()

                  return True

              except Exception as e:

                  print(f"ntfy send failed: {e}")

                  return False

          def main():

              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

              print(f"Scan started: {now}")

              candidates = collect_candidates()

              print(f"Market candidates: {len(candidates)}")

              if not candidates:

                  print("No candidates met market filters.")

                  return

              mapping = load_ticker_ciks()

              lines = [

                  f"미국 소형주 거래량 급증 감시",

                  f"스캔 시각: {now}",

                  f"조건: 주가 ${PRICE_MAX:g} 이하, 거래량 {VOLUME_MIN:,} 이상, 평균 대비 {VOLUME_MULTIPLE_MIN:g}배 이상",

                  "주의: 중국 관련성 및 희석 키워드는 투자 판단의 확정 증거가 아닙니다.",

                  ""

              ]

              for item in candidates[:MAX_ALERTS]:

                  ticker = item["ticker"]

                  sec = sec_check(ticker, mapping)

                  change = item["change"]

                  lines.extend([

                      f"[{ticker}] {item['name']}",

                      f"현재가: ${item['price']:.2f} | 등락률: {change:+.1f}%",

                      f"거래량: {item['volume']:,} | 평균 대비: {item['multiple']:.1f}배",

                      f"중국 관련성: {sec['china']}",

                      f"희석 위험 단서: {sec['dilution']}",

                      f"공시 조회 상태: {sec['status']}",

                      f"공시 확인: {sec['source'] or 'https://www.sec.gov/edgar/search/'}",

                      f"Yahoo Finance: https://finance.yahoo.com/quote/{ticker}/",

                      ""

                  ])

                  time.sleep(0.15)

              send_ntfy("\n".join(lines))

          if __name__ == "__main__":

              main()

          PY

          python scan.py
