
name: China Smallcap Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workflow setup
        run: |
          echo "China small-cap watch workflow started"
          date -u
      - name: Verify ntfy secret exists
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is missing"
            exit 1
          fi
          echo "NTFY_TOPIC secret is configured"
