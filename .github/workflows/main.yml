

name: China Smallcap Watch

on:

  schedule:

    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: china-smallcap-watch

  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: python -m pip install --disable-pip-version-check requests

      - name: Scan candidates and notify

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          SEC_USER_EMAIL: ${{ secrets.SEC_USER_EMAIL }}

        run: |

          cat > scan.py <<'PY'

          import os

          import re

          import time

          import requests

          from datetime import datetime, timezone

          from urllib.parse import quote

          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          SEC_EMAIL = os.environ.get("SEC_USER_EMAIL", "").strip()

          PRICE_MAX = 20.0

          VOLUME_MIN = 100_000

          VOLUME_MULTIPLE_MIN = 2.0

          MAX_ALERTS = 15

          SESSION = requests.Session()

          SESSION.headers.update({

              "User-Agent": "Mozilla/5.0 (compatible; ChinaSmallcapWatch/1.1)",

              "Accept": "application/json,text/plain,*/*"

          })

          def get_number(value, default=0.0):

              try:

                  return float(value) if value is not None else default

              except (ValueError, TypeError):

                  return default

          def yahoo_screen(screen_name):

              url = (

                  "https://query1.finance.yahoo.com/v1/finance/"

                  "screener/predefined/saved"

              )

              params = {

                  "formatted": "false",

                  "lang": "en-US",

                  "region": "US",

                  "scrIds": screen_name,

                  "count": 250,

                  "start": 0

              }

              try:

                  response = SESSION.get(url, params=params, timeout=15)

                  response.raise_for_status()

                  results = response.json().get("finance", {}).get("result", [])

                  return results[0].get("quotes", []) if results else []

              except Exception as exc:

                  print(f"Yahoo screener failed ({screen_name}): {exc}")

                  return []

          def collect_candidates():

              candidates = {}

              for screen_name in ("small_cap_gainers", "most_actives"):

                  quotes = yahoo_screen(screen_name)

                  print(f"Yahoo screen {screen_name}: {len(quotes)} rows")

                  for q in quotes:

                      ticker = str(q.get("symbol", "")).upper().strip()

                      if not re.fullmatch(r"[A-Z][A-Z0-9.\-]{0,9}", ticker):

                          continue

                      price = get_number(q.get("regularMarketPrice"))

                      volume = get_number(q.get("regularMarketVolume"))

                      avg_volume = get_number(

                          q.get("averageDailyVolume3Month")

                          or q.get("averageDailyVolume10Day")

                      )

                      if price <= 0 or price > PRICE_MAX:

                          continue

                      if volume < VOLUME_MIN or avg_volume <= 0:

                          continue

                      multiple = volume / avg_volume

                      if multiple < VOLUME_MULTIPLE_MIN:

                          continue

                      if ticker not in candidates:

                          candidates[ticker] = {

                              "ticker": ticker,

                              "name": q.get("shortName")

                                      or q.get("longName")

                                      or ticker,

                              "price": price,

                              "volume": int(volume),

                              "average_volume": int(avg_volume),

                              "multiple": multiple,

                              "change": get_number(

                                  q.get("regularMarketChangePercent")

                              )

                          }

                      elif multiple > candidates[ticker]["multiple"]:

                          candidates[ticker].update({

                              "price": price,

                              "volume": int(volume),

                              "average_volume": int(avg_volume),

                              "multiple": multiple,

                              "change": get_number(

                                  q.get("regularMarketChangePercent")

                              )

                          })

              return sorted(

                  candidates.values(),

                  key=lambda x: x["multiple"],

                  reverse=True

              )

          def load_ticker_ciks():

              sources = [

                  "https://www.sec.gov/files/company_tickers.json",

                  "https://raw.githubusercontent.com/jadchaar/sec-cik-mapper/main/mappings/stocks/ticker_to_cik.json"

              ]

              for url in sources:

                  try:

                      # Do not force a Host header. Each URL must use its

                      # own correct host.

                      headers = {}

                      if SEC_EMAIL:

                          headers["User-Agent"] = (

                              f"ChinaSmallcapWatch/1.1 ({SEC_EMAIL})"

                          )

                      response = SESSION.get(

                          url, headers=headers, timeout=15

                      )

                      response.raise_for_status()

                      data = response.json()

                      mapping = {}

                      if isinstance(data, dict):

                          for key, value in data.items():

                              if isinstance(value, dict):

                                  ticker = str(

                                      value.get("ticker", key)

                                  ).upper().strip()

                                  cik = (

                                      value.get("cik_str")

                                      or value.get("cik")

                                  )

                              else:

                                  ticker = str(key).upper().strip()

                                  cik = value

                              if cik is None:

                                  continue

                              match = re.search(r"\d+", str(cik))

                              if not match:

                                  continue

                              if re.fullmatch(

                                  r"[A-Z][A-Z0-9.\-]{0,9}", ticker

                              ):

                                  mapping[ticker] = match.group(0).zfill(10)

                      if mapping:

                          print(

                              f"Ticker-CIK mapping loaded: {len(mapping)}"

                          )

                          print(f"Mapping source: {url}")

                          return mapping

                  except Exception as exc:

                      print(f"Ticker mapping unavailable: {exc}")

              print("No ticker-CIK mapping source worked.")

              return {}

          CHINA_TERMS = [

              "china",

              "chinese",

              "hong kong",

              "beijing",

              "shanghai",

              "shenzhen",

              "guangzhou",

              "people's republic of china",

              "variable interest entity",

              "v.i.e.",

              "mainland china",

              "based in china",

              "incorporated in the cayman islands"

          ]

          DILUTION_TERMS = [

              "at-the-market",

              "at the market offering",

              "equity distribution agreement",

              "sales agreement",

              "shelf registration",

              "registered direct offering",

              "public offering",

              "private placement",

              "convertible note",

              "convertible debenture",

              "warrant",

              "exercise price",

              "reverse stock split",

              "dilutive",

              "dilution",

              "securities purchase agreement",

              "prospectus supplement",

              "equity line of credit",

              "424b5",

              "424b3",

              "form s-1",

              "form s-3",

              "common stock offering"

          ]

          def sec_request_headers():

              # Never hard-code Host: the destination host must match the URL.

              contact = SEC_EMAIL or "contact@example.com"

              return {

                  "User-Agent": f"ChinaSmallcapWatch/1.1 ({contact})",

                  "Accept-Encoding": "gzip, deflate",

                  "Accept": "*/*"

              }

          def fetch_filing_text(cik, accession, primary_document):

              cik_path = str(int(cik))

              accession_compact = accession.replace("-", "")

              base = (

                  "https://www.sec.gov/Archives/edgar/data/"

                  f"{cik_path}/{accession_compact}/"

              )

              # Try the exact primary document first, then the full submission.

              urls = []

              if primary_document:

                  urls.append(base + primary_document.lstrip("/"))

              urls.append(base + accession_compact + ".txt")

              for url in urls:

                  try:

                      response = SESSION.get(

                          url,

                          headers=sec_request_headers(),

                          timeout=12

                      )

                      if response.status_code == 403:

                          print("SEC filing access denied (403).")

                          continue

                      if response.status_code == 404:

                          print(

                              f"SEC document not found (404): "

                              f"{primary_document or accession_compact}"

                          )

                          continue

                      response.raise_for_status()

                      if response.text.strip():

                          return response.text, url

                  except Exception as exc:

                      print(f"SEC filing request failed: {exc}")

              return None, None

          def sec_check(ticker, mapping):

              result = {

                  "china": "확인 불가",

                  "dilution": "확인 불가",

                  "status": "공시 조회 실패",

                  "url": (

                      "https://www.sec.gov/edgar/search/"

                      f"#/q={quote(ticker)}"

                  )

              }

              cik = mapping.get(ticker)

              if not cik:

                  result["status"] = "CIK 매핑 없음"

                  return result

              submissions_url = (

                  f"https://data.sec.gov/submissions/CIK{cik}.json"

              )

              try:

                  response = SESSION.get(

                      submissions_url,

                      headers=sec_request_headers(),

                      timeout=12

                  )

                  if response.status_code == 403:

                      result["status"] = "SEC submissions 403 접근 차단"

                      return result

                  response.raise_for_status()

                  company_data = response.json()

                  result["url"] = (

                      f"https://www.sec.gov/edgar/browse/?CIK={cik}"

                  )

                  recent = company_data.get("filings", {}).get("recent", {})

                  forms = recent.get("form", [])

                  documents = recent.get("primaryDocument", [])

                  accessions = recent.get("accessionNumber", [])

                  dates = recent.get("filingDate", [])

                  allowed_forms = {

                      "10-K", "10-Q", "8-K", "S-1", "S-3",

                      "424B3", "424B5", "6-K", "20-F", "F-1", "F-3"

                  }

                  filings = []

                  for i, form in enumerate(forms):

                      if form not in allowed_forms:

                          continue

                      if i >= len(documents) or i >= len(accessions):

                          continue

                      filings.append({

                          "form": form,

                          "document": documents[i],

                          "accession": accessions[i],

                          "date": dates[i] if i < len(dates) else ""

                      })

                      if len(filings) >= 3:

                          break

                  china_hits = set()

                  dilution_hits = set()

                  checked = 0

                  for filing in filings:

                      body, source_url = fetch_filing_text(

                          cik,

                          filing["accession"],

                          filing["document"]

                      )

                      if not body:

                          continue

                      # Remove script/style and markup before keyword scanning.

                      body = re.sub(

                          r"<(script|style)\b[^>]*>.*?</\1>",

                          " ",

                          body,

                          flags=re.I | re.S

                      )

                      body = re.sub(r"<[^>]+>", " ", body)

                      body = re.sub(r"\s+", " ", body).lower()

                      checked += 1

                      for term in CHINA_TERMS:

                          if term in body:

                              china_hits.add(term)

                      for term in DILUTION_TERMS:

                          if term in body:

                              dilution_hits.add(term)

                      print(

                          f"{ticker}: read filing {filing['form']} "

                          f"{filing['date']} from {source_url}"

                      )

                      time.sleep(0.25)

                  if checked == 0:

                      result["status"] = "공시 본문 확인 실패"

                      return result

                  result["status"] = f"공시 본문 {checked}건 검색"

                  if china_hits:

                      result["china"] = (

                          "중국 관련 키워드 발견(추가 검증 필요): "

                          + ", ".join(sorted(china_hits)[:5])

                      )

                  else:

                      result["china"] = (

                          "검색한 공시에서 관련 키워드 미발견"

                      )

                  if dilution_hits:

                      result["dilution"] = (

                          "희석 관련 키워드 발견(추가 검증 필요): "

                          + ", ".join(sorted(dilution_hits)[:6])

                      )

                  else:

                      result["dilution"] = (

                          "검색한 공시에서 관련 키워드 미발견"

                      )

                  return result

              except Exception as exc:

                  print(f"SEC submissions failed for {ticker}: {exc}")

                  result["status"] = "SEC 조회 오류"

                  return result

          def send_ntfy(message):

              if not TOPIC:

                  print("ERROR: NTFY_TOPIC secret is missing.")

                  return False

              try:

                  response = requests.post(

                      f"https://ntfy.sh/{TOPIC}",

                      data=message.encode("utf-8"),

                      headers={

                          "Title": "China Smallcap Watch",

                          "Priority": "high",

                          "Tags": "chart_with_upwards_trend,mag",

                          "Content-Type": "text/plain; charset=utf-8"

                      },

                      timeout=15

                  )

                  print(f"ntfy response: {response.status_code}")

                  response.raise_for_status()

                  print("Notification sent successfully.")

                  return True

              except Exception as exc:

                  print(f"ntfy send failed: {exc}")

                  return False

          def main():

              started = datetime.now(timezone.utc).strftime(

                  "%Y-%m-%d %H:%M UTC"

              )

              print(f"Scan started: {started}")

              candidates = collect_candidates()

              print(f"Market candidates: {len(candidates)}")

              if not candidates:

                  print("No candidates met the market filters.")

                  print("No notification sent because there are no candidates.")

                  return

              mapping = load_ticker_ciks()

              lines = [

                  "미국 소형주 거래량 급증 감시",

                  f"스캔 시각: {started}",

                  (

                      f"조건: 주가 ${PRICE_MAX:g} 이하, "

                      f"거래량 {VOLUME_MIN:,} 이상, "

                      f"평균 거래량 대비 {VOLUME_MULTIPLE_MIN:g}배 이상"

                  ),

                  "",

                  "주의: 키워드 발견은 중국계 여부 또는 실제 희석의 확정 증거가 아닙니다.",

                  "공시 접근 실패 시 확인 불가로 표시합니다.",

                  ""

              ]

              for item in candidates[:MAX_ALERTS]:

                  ticker = item["ticker"]

                  sec = sec_check(ticker, mapping)

                  lines.extend([

                      f"[{ticker}] {item['name']}",

                      (

                          f"현재가: ${item['price']:.2f} | "

                          f"등락률: {item['change']:+.1f}%"

                      ),

                      (

                          f"거래량: {item['volume']:,} | "

                          f"평균 거래량: {item['average_volume']:,} | "

                          f"평균 대비: {item['multiple']:.1f}배"

                      ),

                      f"중국 관련성: {sec['china']}",

                      f"희석 위험 단서: {sec['dilution']}",

                      f"공시 상태: {sec['status']}",

                      f"SEC 공시: {sec['url']}",

                      (

                          "Yahoo Finance: "

                          f"https://finance.yahoo.com/quote/{ticker}/"

                      ),

                      ""

                  ])

                  print(

                      f"{ticker}: volume multiple={item['multiple']:.2f}; "

                      f"SEC={sec['status']}"

                  )

              if not send_ntfy("\n".join(lines)):

                  raise RuntimeError(

                      "Notification failed. Check NTFY_TOPIC and ntfy logs."

                  )

          if __name__ == "__main__":

              main()

          PY

          python scan.py
