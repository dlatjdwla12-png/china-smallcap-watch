

name: China Smallcap Watch

on:

  schedule:

    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: china-smallcap-watch

  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: python -m pip install --disable-pip-version-check requests

      - name: Scan candidates and notify

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          SEC_USER_EMAIL: ${{ secrets.SEC_USER_EMAIL }}

        run: |

          cat > scan.py <<'PY'

          import os

          import re

          import time

          import requests

          from datetime import datetime, timezone

          from urllib.parse import quote

          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          SEC_EMAIL = os.environ.get("SEC_USER_EMAIL", "").strip()

          PRICE_MAX = 20.0

          VOLUME_MIN = 100_000

          VOLUME_MULTIPLE_MIN = 2.0

          MAX_ALERTS = 15

          SESSION = requests.Session()

          SESSION.headers.update({

              "User-Agent": "Mozilla/5.0 (compatible; ChinaSmallcapWatch/1.0)",

              "Accept": "application/json,text/plain,*/*"

          })

          def get_number(value, default=0.0):

              try:

                  return float(value) if value is not None else default

              except (ValueError, TypeError):

                  return default

          def yahoo_screen(screen_name):

              url = (

                  "https://query1.finance.yahoo.com/v1/finance/"

                  "screener/predefined/saved"

              )

              params = {

                  "formatted": "false",

                  "lang": "en-US",

                  "region": "US",

                  "scrIds": screen_name,

                  "count": 250,

                  "start": 0

              }

              try:

                  response = SESSION.get(url, params=params, timeout=15)

                  response.raise_for_status()

                  results = response.json().get("finance", {}).get("result", [])

                  return results[0].get("quotes", []) if results else []

              except Exception as exc:

                  print(f"Yahoo screener failed ({screen_name}): {exc}")

                  return []

          def collect_candidates():

              candidates = {}

              for screen_name in ("small_cap_gainers", "most_actives"):

                  quotes = yahoo_screen(screen_name)

                  print(f"Yahoo screen {screen_name}: {len(quotes)} rows")

                  for quote_item in quotes:

                      ticker = str(quote_item.get("symbol", "")).upper().strip()

                      if not re.fullmatch(r"[A-Z][A-Z0-9.\-]{0,9}", ticker):

                          continue

                      price = get_number(

                          quote_item.get("regularMarketPrice")

                      )

                      volume = get_number(

                          quote_item.get("regularMarketVolume")

                      )

                      average_volume = get_number(

                          quote_item.get("averageDailyVolume3Month")

                          or quote_item.get("averageDailyVolume10Day")

                      )

                      if price <= 0 or price > PRICE_MAX:

                          continue

                      if volume < VOLUME_MIN or average_volume <= 0:

                          continue

                      multiple = volume / average_volume

                      if multiple < VOLUME_MULTIPLE_MIN:

                          continue

                      item = candidates.setdefault(ticker, {

                          "ticker": ticker,

                          "name": quote_item.get("shortName")

                                  or quote_item.get("longName")

                                  or ticker,

                          "price": price,

                          "volume": int(volume),

                          "average_volume": int(average_volume),

                          "multiple": multiple,

                          "change": get_number(

                              quote_item.get("regularMarketChangePercent")

                          )

                      })

                      if multiple > item["multiple"]:

                          item["price"] = price

                          item["volume"] = int(volume)

                          item["average_volume"] = int(average_volume)

                          item["multiple"] = multiple

                          item["change"] = get_number(

                              quote_item.get("regularMarketChangePercent")

                          )

              return sorted(

                  candidates.values(),

                  key=lambda item: item["multiple"],

                  reverse=True

              )

          def load_ticker_ciks():

              sources = [

                  "https://www.sec.gov/files/company_tickers.json",

                  "https://raw.githubusercontent.com/jadchaar/sec-cik-mapper/main/mappings/stocks/ticker_to_cik.json"

              ]

              for url in sources:

                  try:

                      response = SESSION.get(url, timeout=15)

                      response.raise_for_status()

                      data = response.json()

                      mapping = {}

                      if isinstance(data, dict):

                          for key, value in data.items():

                              if isinstance(value, dict):

                                  ticker = str(

                                      value.get("ticker", key)

                                  ).upper().strip()

                                  cik = value.get("cik_str") or value.get("cik")

                              else:

                                  ticker = str(key).upper().strip()

                                  cik = value

                              if cik is None:

                                  continue

                              cik_text = str(cik).strip()

                              match = re.search(r"\d+", cik_text)

                              if not match:

                                  continue

                              if re.fullmatch(r"[A-Z][A-Z0-9.\-]{0,9}", ticker):

                                  mapping[ticker] = match.group(0).zfill(10)

                      if mapping:

                          print(f"Ticker-CIK mapping loaded: {len(mapping)}")

                          print(f"Mapping source: {url}")

                          return mapping

                  except Exception as exc:

                      print(f"Ticker mapping unavailable: {exc}")

              print("No ticker-CIK mapping source worked.")

              return {}

          CHINA_TERMS = [

              "china",

              "chinese",

              "hong kong",

              "beijing",

              "shanghai",

              "shenzhen",

              "guangzhou",

              "people's republic of china",

              "variable interest entity",

              "v.i.e."

          ]

          DILUTION_TERMS = [

              "at-the-market",

              "at the market offering",

              "equity distribution agreement",

              "sales agreement",

              "shelf registration",

              "registered direct offering",

              "public offering",

              "private placement",

              "convertible note",

              "convertible debenture",

              "warrant",

              "exercise price",

              "reverse stock split",

              "dilutive",

              "dilution",

              "securities purchase agreement",

              "prospectus supplement",

              "equity line of credit",

              "424b5"

          ]

          def sec_headers():

              # SEC asks automated clients to identify themselves.

              contact = SEC_EMAIL or "contact@example.com"

              return {

                  "User-Agent": f"ChinaSmallcapWatch/1.0 ({contact})",

                  "Accept-Encoding": "gzip, deflate",

                  "Host": "data.sec.gov"

              }

          def sec_check(ticker, mapping):

              result = {

                  "china": "확인 불가",

                  "dilution": "확인 불가",

                  "status": "공시 조회 실패",

                  "url": f"https://www.sec.gov/edgar/search/#/q={quote(ticker)}"

              }

              cik = mapping.get(ticker)

              if not cik:

                  result["status"] = "CIK 매핑 없음"

                  return result

              submissions_url = (

                  f"https://data.sec.gov/submissions/CIK{cik}.json"

              )

              try:

                  response = SESSION.get(

                      submissions_url,

                      headers=sec_headers(),

                      timeout=12

                  )

                  if response.status_code == 403:

                      result["status"] = "SEC 403 접근 차단"

                      return result

                  response.raise_for_status()

                  company_data = response.json()

                  recent = company_data.get("filings", {}).get("recent", {})

                  forms = recent.get("form", [])

                  documents = recent.get("primaryDocument", [])

                  accessions = recent.get("accessionNumber", [])

                  dates = recent.get("filingDate", [])

                  matched = []

                  allowed_forms = {

                      "10-K", "10-Q", "8-K", "S-1", "S-3",

                      "424B3", "424B5", "6-K", "20-F", "F-1", "F-3"

                  }

                  for index, form in enumerate(forms):

                      if form not in allowed_forms:

                          continue

                      if index >= len(documents) or index >= len(accessions):

                          continue

                      matched.append({

                          "form": form,

                          "document": documents[index],

                          "accession": accessions[index],

                          "date": dates[index] if index < len(dates) else ""

                      })

                      if len(matched) >= 3:

                          break

                  china_hits = set()

                  dilution_hits = set()

                  checked = 0

                  for filing in matched:

                      accession = filing["accession"].replace("-", "")

                      document = filing["document"]

                      filing_url = (

                          "https://www.sec.gov/Archives/edgar/data/"

                          f"{int(cik)}/{accession}/{document}"

                      )

                      try:

                          filing_response = SESSION.get(

                              filing_url,

                              headers=sec_headers(),

                              timeout=12

                          )

                          if filing_response.status_code == 403:

                              continue

                          filing_response.raise_for_status()

                          body = filing_response.text.lower()

                          body = re.sub(

                              r"<script\b[^>]*>.*?</script>",

                              " ",

                              body,

                              flags=re.I | re.S

                          )

                          body = re.sub(r"<[^>]+>", " ", body)

                          body = re.sub(r"\s+", " ", body)

                          checked += 1

                          for term in CHINA_TERMS:

                              if term in body:

                                  china_hits.add(term)

                          for term in DILUTION_TERMS:

                              if term in body:

                                  dilution_hits.add(term)

                          time.sleep(0.2)

                      except Exception as exc:

                          print(

                              f"Filing download failed for {ticker}: {exc}"

                          )

                  result["url"] = (

                      f"https://www.sec.gov/edgar/browse/?CIK={cik}"

                  )

                  if checked == 0:

                      result["status"] = "공시 본문 확인 실패"

                      return result

                  result["status"] = f"공시 본문 {checked}건 검색"

                  if china_hits:

                      result["china"] = (

                          "중국 관련 키워드 발견(추가 검증 필요): "

                          + ", ".join(sorted(china_hits)[:5])

                      )

                  else:

                      result["china"] = (

                          "검색한 공시에서 관련 키워드 미발견"

                      )

                  if dilution_hits:

                      result["dilution"] = (

                          "희석 관련 키워드 발견(추가 검증 필요): "

                          + ", ".join(sorted(dilution_hits)[:6])

                      )

                  else:

                      result["dilution"] = (

                          "검색한 공시에서 관련 키워드 미발견"

                      )

                  return result

              except Exception as exc:

                  print(f"SEC submissions failed for {ticker}: {exc}")

                  result["status"] = "SEC 조회 오류"

                  return result

          def send_ntfy(message):

              if not TOPIC:

                  print("ERROR: NTFY_TOPIC secret is missing.")

                  return False

              # Keep all HTTP header values ASCII-safe.

              # Korean alert content is sent in the UTF-8 request body.

              try:

                  response = requests.post(

                      f"https://ntfy.sh/{TOPIC}",

                      data=message.encode("utf-8"),

                      headers={

                          "Title": "China Smallcap Watch",

                          "Priority": "high",

                          "Tags": "chart_with_upwards_trend,mag",

                          "Content-Type": "text/plain; charset=utf-8"

                      },

                      timeout=15

                  )

                  print(f"ntfy response: {response.status_code}")

                  response.raise_for_status()

                  print("Notification sent successfully.")

                  return True

              except Exception as exc:

                  print(f"ntfy send failed: {exc}")

                  return False

          def main():

              started = datetime.now(timezone.utc).strftime(

                  "%Y-%m-%d %H:%M UTC"

              )

              print(f"Scan started: {started}")

              candidates = collect_candidates()

              print(f"Market candidates: {len(candidates)}")

              if not candidates:

                  print("No candidates met the market filters.")

                  print("No notification sent because there are no candidates.")

                  return

              mapping = load_ticker_ciks()

              lines = [

                  "미국 소형주 거래량 급증 감시",

                  f"스캔 시각: {started}",

                  (

                      f"조건: 주가 ${PRICE_MAX:g} 이하, "

                      f"거래량 {VOLUME_MIN:,} 이상, "

                      f"평균 거래량 대비 {VOLUME_MULTIPLE_MIN:g}배 이상"

                  ),

                  "",

                  "주의: 키워드 발견은 중국계 여부 또는 실제 희석의 확정 증거가 아닙니다.",

                  "공시 접근 실패 시 확인 불가로 표시합니다.",

                  ""

              ]

              for item in candidates[:MAX_ALERTS]:

                  ticker = item["ticker"]

                  sec = sec_check(ticker, mapping)

                  lines.extend([

                      f"[{ticker}] {item['name']}",

                      (

                          f"현재가: ${item['price']:.2f} | "

                          f"등락률: {item['change']:+.1f}%"

                      ),

                      (

                          f"거래량: {item['volume']:,} | "

                          f"평균 거래량: {item['average_volume']:,} | "

                          f"평균 대비: {item['multiple']:.1f}배"

                      ),

                      f"중국 관련성: {sec['china']}",

                      f"희석 위험 단서: {sec['dilution']}",

                      f"공시 상태: {sec['status']}",

                      f"SEC 공시: {sec['url']}",

                      f"Yahoo Finance: https://finance.yahoo.com/quote/{ticker}/",

                      ""

                  ])

                  print(

                      f"{ticker}: volume multiple={item['multiple']:.2f}; "

                      f"SEC={sec['status']}"

                  )

              sent = send_ntfy("\n".join(lines))

              if not sent:

                  raise RuntimeError(

                      "Notification failed. Check NTFY_TOPIC and ntfy logs."

                  )

          if __name__ == "__main__":

              main()

          PY

          python scan.py
