name: China Smallcap Watch

on:

  workflow_dispatch:

  schedule:

    - cron: "*/15 * * * *"

permissions:

  contents: read

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 3

    steps:

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Scan free market data

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          python - <<'PY'

          import os

          import json

          import urllib.request

          import urllib.parse

          from datetime import datetime, timezone

          topic = os.environ.get("NTFY_TOPIC", "").strip()

          if not topic:

              raise SystemExit("NTFY_TOPIC secret is missing")

          headers = {"User-Agent": "Mozilla/5.0"}

          screeners = ["small_cap_gainers", "most_actives"]

          found = {}

          for screener in screeners:

              params = urllib.parse.urlencode({

                  "scrIds": screener,

                  "count": 250,

                  "start": 0,

                  "formatted": "false"

              })

              url = (

                  "https://query1.finance.yahoo.com/v1/finance/"

                  "screener/predefined/saved?" + params

              )

              try:

                  req = urllib.request.Request(

                      url, headers=headers

                  )

                  with urllib.request.urlopen(

                      req, timeout=20

                  ) as response:

                      data = json.loads(

                          response.read().decode("utf-8")

                      )

                  quotes = data["finance"]["result"][0]["quotes"]

                  for q in quotes:

                      symbol = q.get("symbol")

                      if symbol:

                          found[symbol] = q

              except Exception as e:

                  print(f"{screener} data unavailable: {e}")

          if not found:

              raise SystemExit(

                  "No market data received. No alert generated."

              )

          china_words = [

              "china", "chinese", "hong kong", "beijing",

              "shanghai", "shenzhen", "nanjing", "hangzhou",

              "wuhan", "chengdu", "xiamen", "tianjin",

              "suzhou", "guangzhou", "macau"

          ]

          candidates = []

          for symbol, q in found.items():

              name = (

                  q.get("shortName")

                  or q.get("longName")

                  or symbol

              )

              price = q.get("regularMarketPrice")

              volume = q.get("regularMarketVolume")

              avg = q.get("averageDailyVolume3Month")

              cap = q.get("marketCap")

              if not all(

                  isinstance(x, (int, float))

                  for x in [price, volume, avg]

              ):

                  continue

              if avg <= 0 or price <= 0:

                  continue

              if price > 20 or volume < 100000:

                  continue

              ratio = volume / avg

              if ratio < 2:

                  continue

              name_match = any(

                  word in name.lower()

                  for word in china_words

              )

              candidates.append({

                  "symbol": symbol,

                  "name": name,

                  "price": price,

                  "volume": volume,

                  "avg": avg,

                  "ratio": ratio,

                  "cap": cap,

                  "name_match": name_match

              })

          # Put possible China-name matches first,

          # then sort by volume ratio within each group.

          candidates.sort(

              key=lambda x: (

                  x["name_match"],

                  x["ratio"]

              ),

              reverse=True

          )

          candidates = candidates[:10]

          now = datetime.now(timezone.utc).strftime(

              "%Y-%m-%d %H:%M UTC"

          )

          lines = [

              "중국계 미국 소형주 조기 감지 - 예비 스캔",

              f"스캔 시각(UTC): {now}",

              "데이터 출처: Yahoo Finance 스크리너 (시세 지연 가능)",

              "거래량 배수 = 현재 거래량 / 3개월 평균 일일 거래량",

              "주의: 이름 키워드만으로 중국 관련성이 입증되지는 않습니다.",

              "희석 위험 및 실제 중국 사업 여부는 별도 확인이 필요합니다.",

              ""

          ]

          for c in candidates:

              if c["name_match"]:

                  tag = (

                      "이름 키워드 일치 - 중국 관련성 추가 확인 필요"

                  )

              else:

                  tag = (

                      "중국 관련성 미확인 - 추가 조사 필요"

                  )

              lines.append(

                  f'{c["symbol"]} | {c["name"]}\n'

                  f'주가: ${c["price"]:.2f} | '

                  f'현재 거래량: {c["volume"]:,.0f} | '

                  f'3개월 평균 거래량: {c["avg"]:,.0f} | '

                  f'평균 대비 거래량: {c["ratio"]:.1f}x\n'

                  f'{tag}\n'

              )

          if not candidates:

              lines.append(

                  "초기 주가 및 거래량 필터를 통과한 후보가 없습니다."

              )

          message = "\n".join(lines)

          print(message)

          # Send a notification only when candidates are found.

          if candidates:

              request = urllib.request.Request(

                  "https://ntfy.sh/"

                  + urllib.parse.quote(topic, safe=""),

                  data=message.encode("utf-8"),

                  headers={

                      "Title": "China Smallcap Alert",

                      "Priority": "high",

                      "Tags": "chart_with_upwards_trend",

                      "Content-Type": "text/plain; charset=utf-8"

                  },

                  method="POST"

              )

              with urllib.request.urlopen(

                  request, timeout=20

              ) as response:

                  print("ntfy response:", response.status)

          else:

              print("No alert sent.")

          PY
