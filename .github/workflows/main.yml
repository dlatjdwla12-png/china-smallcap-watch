

name: China Smallcap Watch

on:

  schedule:

    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: china-smallcap-watch

  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 12

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: python -m pip install --disable-pip-version-check requests

      - name: Scan candidates and notify

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          SEC_USER_EMAIL: ${{ secrets.SEC_USER_EMAIL }}

        run: python scan.py
